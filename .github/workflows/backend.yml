name: backend

on:
  push:
    branches: [master]
    paths: ["app/backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["app/backend/**", ".github/workflows/backend.yml"]
  schedule:
    # El código duerme ~11 meses al año: compilar y probar cada mes detecta dependencias y toolchain rotos a tiempo.
    - cron: "0 12 1 * *"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/backend
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bin: [cloud-api, worker]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg BIN=${{ matrix.bin }} app/backend
