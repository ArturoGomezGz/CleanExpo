events {}
http {
  # Docker resuelve "internal-api" a todas las réplicas; nginx reparte round-robin.
  upstream internal_api { server internal-api:8000; }
  server {
    listen 8080;
    location / {
      proxy_pass http://internal_api;
      proxy_set_header Host $host;
      proxy_next_upstream error timeout http_502 http_503;
    }
  }
}
