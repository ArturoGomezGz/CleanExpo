[workspace]
resolver = "2"
members = ["crates/common", "crates/cloud-api", "crates/worker", "crates/images"]

[workspace.package]
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
tower-http = { version = "0.6", features = ["cors"] }
rust_decimal = { version = "1", features = ["serde-float"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "rust_decimal", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
expo-common = { path = "crates/common" }
