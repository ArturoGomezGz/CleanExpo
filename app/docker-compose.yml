# Desarrollo local de Clean Expo. Simula las dos zonas:
#   nube:     web, cloud-api, worker, postgres
#   interna:  lb -> internal-api (varias réplicas) -> puente "bridge" (en prod: SQL Server de MR)
# Uso:  cp .env.example .env && docker compose up --build --scale internal-api=2
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # solo crea la base 'bridge'; el esquema lo migra cloud-api
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  cloud-api:
    build: { context: ./backend, args: { BIN: cloud-api } }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PORT: "8000"
      SEED_DEV: "true"   # datos ficticios solo en local
      MR_MODE: fake      # precios y crédito simulados; en producción INTERNAL_API_URL + INTERNAL_API_KEY
      CORS_ORIGINS: http://localhost:3000
    depends_on: { postgres: { condition: service_healthy } }

  worker:
    build: { context: ./backend, args: { BIN: worker } }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INTERNAL_API_URL: http://lb:8080
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on: { cloud-api: { condition: service_started }, lb: { condition: service_started } }  # cloud-api migra el esquema

  internal-api:
    build: ./internal-api
    environment:
      BRIDGE_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/bridge
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    depends_on: { postgres: { condition: service_healthy } }
    deploy: { replicas: 2 }

  lb:
    image: nginx:1.27-alpine
    volumes: [ "./lb/nginx.conf:/etc/nginx/nginx.conf:ro" ]
    depends_on: [ internal-api ]
    ports: [ "8080:8080" ]     # solo para pruebas locales; en prod entra por Cloudflare Tunnel

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [ cloud-api ]
    ports: [ "8000:80" ]

  frontend:
    build:                # SvelteKit contra cloud-api (pasa por el nginx de `web`); ver frontend/README.md
      context: ./frontend
      args: { VITE_API_MODE: http, VITE_API_URL: "http://localhost:8000/api" }
    ports: [ "3000:3000" ]

volumes:
  pgdata:
